# GitHub Pages へ公開する。
# 自動更新(dxg-sync)が dataset/ をpushすると、この流れが動き、公開が更新される(新しい歌唱が、そのまま公開される)。
# 公開するもの: site/ の中身(画面)と、dataset/ の3ファイル(データ)。それ以外(app.py、scripts/ など)は、公開しない。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "dataset/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 続けてpushされたときは、古い実行を捨てて、新しいほうだけを動かす
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 公開するファイルを集める
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -f _site/demo.html        # 試作の画面(../dataset を読む作りなので、ここでは動かない)
          mkdir _site/dataset
          cp dataset/history.jsonl dataset/meta.json dataset/comment_master.json _site/dataset/

      # GitHub Pages は、ファイルを10分間キャッシュする(Cache-Control: max-age=600)。F5(通常の再読み込み)で、確認し直されるのは、index.html だけで、
      # しかも、アドレスごとに別々にキャッシュされる。JS・CSS が更新されても、最大10分、古いものが使われる。
      # そこで、(1) version.json に、commitの識別子(版)を書く。index.html(更新しない固定の殻)が、これを、毎回、確認し直して、
      # 版を付けたアドレスで viewer.js を読む。viewer.js は、同じ版を、detail.js などのアドレスにも付ける。
      # (2) detail.js の中の import には、ソースの __VER__ を、この版に置き換えて付ける。
      # (データ(history.jsonl)は、読み込みのたびに、更新を確認する作りなので、対象外)
      - name: 版を付ける
        run: |
          VER="${GITHUB_SHA::8}"
          printf '{"v":"%s"}\n' "${VER}" > _site/version.json
          sed -i "s/__VER__/${VER}/g" _site/detail.js
          if grep -rq "__VER__" _site; then echo "__VER__ が残っています"; grep -rn "__VER__" _site; exit 1; fi
          echo "版: ${VER}"; cat _site/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
