name: probe (DAMに接続できるかの確認用)

# 手動実行のみ。GitHub Actions のサーバー(海外IP)から DAM★とも のAPIに届くかを確認する。
# 一覧を1回取得するだけで、データの書き込みや詳細の取得はしない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List newest page only (dry-run)
        env:
          DAM_CARD: ${{ secrets.DAM_CARD }}
        run: python scripts/update.py --dry-run
